# nginx site for the lunarnav API behind Cloudflare (used instead of Caddy when nginx already serves
# other sites on the VPS, e.g. the landing page). Installed by deploy/setup-nginx-api.sh as
# /etc/nginx/sites-available/__API_DOMAIN__ ; certbot --nginx later adds the 443 server block.
#
# - The API listens on 127.0.0.1:3000 only (pm2, deploy/ecosystem.config.cjs).
# - Real client IPs: Cloudflare sends CF-Connecting-IP; the trusted Cloudflare ranges are in
#   /etc/nginx/conf.d/cloudflare-realip.conf (generated by the setup script). nginx then passes the
#   real IP in X-Forwarded-For, and the API (trustProxy loopback) rate-limits per client.
# - SSE (GET /api/v1/jobs/{id}/events): buffering off, long read timeout.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;
    server_tokens off;

    client_max_body_size 1m;
    access_log /var/log/nginx/__API_DOMAIN__.access.log;
    error_log  /var/log/nginx/__API_DOMAIN__.error.log warn;

    location = / {
        return 302 /docs;
    }

    # Job progress stream: no buffering, keep the connection open.
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # sync Python calls (alt-dates, tools) can take up to ~2 min
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
