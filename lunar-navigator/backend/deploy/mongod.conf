# /etc/mongod.conf for the VPS (MongoDB 8.0, official apt package). Installed by provision-ubuntu.sh.
# Only reachable from the VPS itself (bindIp 127.0.0.1) and only with a user (authorization enabled).
# Never open port 27017 in the firewall; use an SSH tunnel for Compass:
#   ssh -L 27018:127.0.0.1:27017 lunar@<vps>   ->  mongodb://<user>@127.0.0.1:27018/?authSource=admin

storage:
  dbPath: /var/lib/mongodb
  # Small VPS (2 GB RAM): cap the WiredTiger cache (default = 50% of (RAM - 1 GB)).
  # wiredTiger:
  #   engineConfig:
  #     cacheSizeGB: 0.5

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

security:
  authorization: enabled
