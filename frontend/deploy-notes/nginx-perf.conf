# nginx settings for https://lunavigator.com (Next.js behind nginx, Cloudflare in front).
#
# How to apply
#   1. Paste PART 1 inside the existing `http { ... }` block (or a file in /etc/nginx/conf.d/).
#   2. Paste PART 2 inside the existing `server { listen 443 ssl ...; server_name lunavigator.com; ... }` block,
#      before the catch-all `location / { proxy_pass ... }`.
#   3. Replace 127.0.0.1:3000 with the port the frontend really listens on (see the current proxy_pass).
#   4. `nginx -t && systemctl reload nginx`
#   5. Check:  curl -sI https://lunavigator.com/images/moon-mosaic-640.webp | grep -i cache-control
#              curl -sI -H 'Accept-Encoding: gzip' https://lunavigator.com/ | grep -i -E 'content-encoding|strict-transport'
#
# nginx rule to remember: an `add_header` inside a location REPLACES every add_header inherited from the
# server block. That is why the security headers live in one snippet that each location includes.


# ───────────────────────────── PART 1 · http { } ─────────────────────────────

# Compression. Next.js already gzips its own responses; these lines cover everything nginx serves or proxies
# uncompressed, and `gzip_proxied any` keeps compression on for requests that arrive through Cloudflare.
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_vary         on;
gzip_types        text/plain text/css text/xml text/javascript application/javascript application/json
                  application/manifest+json application/xml application/rss+xml application/ld+json
                  image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
# (text/html is always compressed; woff2, webp, jpg and png are already compressed and must not be listed.)

# Brotli: only if the ngx_brotli module is installed (`nginx -V 2>&1 | grep -o brotli`). Without it, leave these
# lines commented: Cloudflare already serves Brotli to browsers from a gzip origin.
# brotli            on;
# brotli_comp_level 5;
# brotli_min_length 1024;
# brotli_types      text/plain text/css text/xml text/javascript application/javascript application/json
#                   application/manifest+json application/xml application/ld+json image/svg+xml;

# Keep connections to the Next.js process open instead of opening one per request.
upstream moonplanb_frontend {
    server 127.0.0.1:3000;      # <- the frontend port
    keepalive 32;
}


# ──────────────────────── PART 2 · server { } for lunavigator.com ────────────────────────

# Security headers, written once. Save these lines as /etc/nginx/snippets/moonplanb-security.conf:
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     add_header X-Content-Type-Options    "nosniff" always;
#     add_header X-Frame-Options           "SAMEORIGIN" always;
#     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
#     add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
#     add_header Cross-Origin-Opener-Policy "same-origin" always;
#
# Notes:
#   - X-Frame-Options stays SAMEORIGIN (not DENY): /api-docs embeds /api-docs/index.html in an iframe.
#   - If nginx or Cloudflare already sends one of these headers, remove the duplicate there.
#   - Add `preload` to HSTS only after every subdomain (api.lunavigator.com too) is HTTPS-only for good.
#   - No Content-Security-Policy here on purpose: Next.js emits inline scripts, so a useful policy needs nonces
#     from the app. Lighthouse does not score its absence.

include snippets/moonplanb-security.conf;

proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# Fingerprinted build output: the file name changes whenever the content does, so cache it for a year.
location /_next/static/ {
    proxy_pass http://moonplanb_frontend;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/moonplanb-security.conf;
    access_log off;
}

# Pictures in public/: not fingerprinted, so 30 days in the browser, and a changed picture gets a new file name.
# stale-while-revalidate lets a returning visitor reuse the copy while the browser re-checks it.
# (The app sends the same header itself since this change; this block also covers an older build and lets
# Cloudflare cache at the edge with the same lifetime.)
location ~ ^/(images|brand|team)/ {
    proxy_pass http://moonplanb_frontend;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    include snippets/moonplanb-security.conf;
    access_log off;
}

# robots.txt and sitemap.xml are generated by the app (app/robots.ts, app/sitemap.ts); an hour is plenty.
location ~ ^/(robots\.txt|sitemap\.xml)$ {
    proxy_pass http://moonplanb_frontend;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600" always;
    include snippets/moonplanb-security.conf;
}

# Pages, /api and /guide keep going through the existing `location / { proxy_pass ...; }` unchanged,
# so no HTML and no API response is cached by this file. Point that block at the upstream too:
#
#     location / {
#         proxy_pass http://moonplanb_frontend;
#     }
